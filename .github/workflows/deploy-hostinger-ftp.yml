name: Deploy static site to Hostinger FTP

on:
  push:
    branches: [main]

concurrency:
  group: hostinger-ftp-main
  cancel-in-progress: true

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static export
        run: npm run export

      # Exclusive public_html for pimo.info. Fresh state-name escapes a stale
      # .ftp-deploy-sync-state.json that tried to delete missing _next/data paths
      # (FTP 550). Clean-slate keeps remote in sync with each static export.
      - name: Upload /out via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state-v2.json
          dangerous-clean-slate: true
