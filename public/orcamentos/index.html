<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Pimo Casa · Orçamentos</title>
  <base href="/orcamentos/">
  <link rel="icon" href="/orcamentos/logo.png" type="image/png">
  <style>
:root {
  --ink: #141414;
  --slate: #0f172a;
  --muted: #475569;
  --soft: #64748b;
  --line: #e3e8f0;
  --line2: #e2e8f0;
  --head: #1f293b;
  --zebra: #f5f5f5;
  --link: #1d4ed8;
  --bg: #ffffff;
  --panel: #f8fafc;
  --warn: #b45309;
  --ok: #166534;
  --bad: #9f1239;
  --ui: #0f172a;
  --ui-border: #cbd5e1;
  --radius: 2px;
  --font: Helvetica, "Liberation Sans", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: #eef2f7;
  font-size: 15px;
  line-height: 1.45;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.hidden { display: none !important; }
#app-shell { min-height: 100vh; }
.gate {
  max-width: 420px;
  margin: 8vh auto;
  background: #fff;
  border: 1px solid var(--line);
  padding: 28px 24px 22px;
}
.gate .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.gate .brand img { height: 40px; width: auto; max-width: 120px; background: transparent; border-radius: 0; object-fit: contain; }
.gate h1 { font-size: 1.15rem; margin: 0 0 6px; color: var(--slate); }
.gate p { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }
.gate label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.gate input, .toolbar input, .toolbar select, .panel input, .panel select, .panel textarea {
  width: 100%;
  border: 1px solid var(--ui-border);
  padding: 8px 10px;
  font: inherit;
  border-radius: var(--radius);
  background: #fff;
}
.gate button, .btn {
  appearance: none;
  border: 1px solid var(--head);
  background: var(--head);
  color: #fff;
  font: inherit;
  font-weight: 600;
  padding: 8px 14px;
  cursor: pointer;
  border-radius: var(--radius);
}
.btn.secondary { background: #fff; color: var(--slate); border-color: var(--ui-border); }
.btn.danger { background: #fff; color: var(--bad); border-color: #fecaca; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.err { color: var(--bad); font-size: 0.88rem; margin-top: 10px; min-height: 1.2em; }
.toolbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(255,255,255,0.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(6px);
  padding: 8px 12px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.toolbar .spacer { flex: 1; }
.toolbar .chip {
  font-size: 0.78rem; color: var(--muted);
  border: 1px solid var(--line); padding: 4px 8px; border-radius: 999px;
}
.layout { display: grid; grid-template-columns: 280px 1fr; gap: 0; max-width: 1400px; margin: 0 auto; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
}
.side {
  background: #fff;
  border-right: 1px solid var(--line);
  padding: 14px 12px 40px;
  min-height: calc(100vh - 52px);
}
.side h2 { font-size: 0.95rem; margin: 0 0 10px; }
.side .proj {
  border: 1px solid var(--line);
  padding: 10px;
  margin: 0 0 8px;
  cursor: pointer;
  background: #fff;
}
.side .proj:hover, .side .proj.active { border-color: var(--head); background: var(--panel); }
.side .proj .t { font-weight: 700; font-size: 0.9rem; color: var(--slate); }
.side .proj .m { font-size: 0.75rem; color: var(--soft); margin-top: 4px; }
.main { padding: 12px; }
.report {
  background: #fff;
  border: 1px solid var(--line);
  padding: 28px 32px 40px;
  max-width: 900px;
  margin: 0 auto 24px;
  box-shadow: 0 1px 0 rgba(15,23,42,0.04);
}
.hdr { display: flex; align-items: center; gap: 12px; background: transparent; }
.hdr img.logo {
  height: 48px; width: auto; max-width: 160px;
  background: transparent !important; border: 0; border-radius: 0;
  object-fit: contain; object-position: left center; display: block;
}
.hdr .b { font-weight: 700; font-size: 1.15rem; color: var(--slate); line-height: 1.2; }
.hdr .s { font-size: 0.85rem; color: var(--muted); }
input.ed, textarea.ed, select.ed {
  width: 100%; border: 1px solid var(--ui-border); padding: 4px 6px;
  font: inherit; font-size: 0.75rem; background: #fff; border-radius: var(--radius);
}
tr.a-definir input.ed { color: #b91c1c; border-color: #fecaca; background: #fff; }
.ed-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
.sheet-summary { font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; line-height: 1.4; }
.grand-totals { margin-top: 18px; padding-top: 8px; border-top: 2px solid var(--line); }
.rule { border-top: 1px solid var(--line); margin: 10px 0 0; }
h1.doc { font-size: 1.25rem; color: var(--slate); margin: 14px 0 12px; line-height: 1.3; }
h2.sec { font-size: 1.05rem; color: var(--slate); margin: 22px 0 8px; page-break-after: avoid; }
h3.sub { font-size: 0.95rem; color: var(--slate); margin: 14px 0 6px; page-break-after: avoid; }
p { margin: 0 0 8px; }
.muted { color: var(--soft); }
.note { font-size: 0.82rem; color: var(--muted); line-height: 1.35; margin: 0 0 10px; }
.cap { font-size: 0.75rem; color: var(--soft); margin: 2px 0 10px; }
table.info { width: 100%; border-collapse: collapse; margin: 0 0 10px; }
table.info td { padding: 3px 0 8px; vertical-align: top; font-size: 0.92rem; }
table.info td.k { font-weight: 700; color: var(--muted); width: 140px; }
table.t { width: 100%; border-collapse: collapse; margin: 0 0 10px; table-layout: fixed; }
table.t th {
  background: var(--head); color: #fff; font-weight: 700;
  font-size: 0.72rem; text-align: left; padding: 7px 6px; vertical-align: bottom;
}
table.t td {
  font-size: 0.78rem; color: #334155; padding: 6px;
  vertical-align: top; line-height: 1.3; overflow-wrap: break-word;
  border-bottom: 1px solid var(--line2);
}
table.t tr:nth-child(even) td { background: var(--zebra); }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t tr.tot td { font-weight: 700; color: #000; background: #fff; border-top: 1px solid #cbd5e1; }
.box {
  border: 1px solid var(--line2);
  border-left: 3px solid var(--head);
  padding: 8px 12px;
  margin: 8px 0 12px;
  background: var(--panel);
}
.box.warn { border-left-color: var(--warn); background: #fffbeb; }
.sig { margin-top: 22px; font-size: 0.92rem; line-height: 1.5; color: var(--slate); }
.sig strong { display: block; margin-top: 8px; }
.footer-print {
  display: none;
}
.asset-img { width: 100%; max-height: 360px; object-fit: contain; background: #fafbfc; border: 1px solid #eef2f7; display: block; margin: 6px 0 12px; }
.status-pill {
  display: inline-block; font-size: 0.72rem; padding: 2px 7px;
  border: 1px solid var(--line); color: var(--muted); border-radius: 999px;
}
.panel {
  background: #fff; border: 1px solid var(--line); padding: 14px; margin: 0 0 12px;
}
.panel h3 { margin: 0 0 8px; font-size: 0.95rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.row > * { flex: 1 1 140px; }
.compare td.pick { cursor: pointer; }
.compare td.pick:hover { outline: 2px solid var(--link); }
.compare td.picked { background: #ecfdf5 !important; }
.print-opts label { display: inline-flex; gap: 6px; align-items: center; margin: 0 10px 6px 0; font-size: 0.82rem; color: var(--muted); }
.price-tag { font-size: 1.4rem; font-weight: 700; color: var(--slate); }
.client-opts { display: grid; gap: 8px; margin: 12px 0; }
.client-opts label {
  border: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
}
.client-opts label.active { border-color: var(--head); background: var(--panel); }
.factory-form textarea { min-height: 70px; }
.toast {
  position: fixed; right: 14px; bottom: 14px; background: var(--slate); color: #fff;
  padding: 10px 14px; border-radius: var(--radius); font-size: 0.85rem; z-index: 50;
  opacity: 0; transform: translateY(8px); transition: .2s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
tr.a-definir td, .a-definir-cell {
  color: #b91c1c !important;
  background: #fef2f2 !important;
  font-weight: 600;
}
.a-definir-input {
  width: 100%;
  max-width: 110px;
  border: 1px solid #fecaca;
  background: #fff;
  color: #b91c1c;
  font: inherit;
  font-size: 0.78rem;
  padding: 4px 6px;
}
.totals-note-warn { color: #b91c1c; font-size: 0.85rem; margin: 6px 0 10px; }
.asset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.asset-grid figure { margin: 0; }
.asset-grid figcaption { font-size: 0.72rem; color: var(--soft); margin-top: 4px; }
.checks-confirm { margin: 12px 0; padding: 10px 12px; background: #fff7ed; border: 1px solid #fed7aa; }
.checks-confirm h3 { color: #9a3412; margin: 0 0 8px; font-size: 0.95rem; }
.checks-confirm li, .checks-confirm td { color: #9a3412; }
.checks-confirm table td { background: #fff7ed; }

@media print {
  body { background: #fff; }
  .toolbar, .side, .no-print, .toast { display: none !important; }
  .layout { display: block; }
  .main { padding: 0; }
  .report {
    border: 0; box-shadow: none; max-width: none; margin: 0; padding: 0;
  }
  .pagebreak { break-before: page; page-break-before: always; }
  .sec-hide-print { display: none !important; }
  .hdr img.logo { height: 40px; max-width: 140px; background: transparent !important; }
  .footer-print {
    display: block;
    position: running(footer);
  }
  @page {
    size: A4;
    margin: 18mm 16mm 18mm 16mm;
    @bottom-left {
      content: "PIMO CASA";
      font: 8pt Helvetica, Arial, sans-serif;
      color: #646464;
      border-top: 0.75pt solid #e3e8f0;
      padding-top: 5pt;
    }
    @bottom-right {
      content: counter(page) " / " counter(pages);
      font: 8pt Helvetica, Arial, sans-serif;
      color: #646464;
      border-top: 0.75pt solid #e3e8f0;
      padding-top: 5pt;
    }
  }
  .sec-hide-print { display: none !important; }
}
  </style>
</head>
<body>
<div id="app-shell">
  <div id="view-gate" class="gate">
    <div class="brand">
      <img src="/orcamentos/logo.png" alt="Pimo Casa">
      <div>
        <div class="b" style="font-weight:700;color:#0f172a">PIMO CASA</div>
        <div class="s" style="font-size:0.82rem;color:#475569">Orçamentos</div>
      </div>
    </div>
    <h1 id="gate-title">Acesso ao orçamento</h1>
    <p id="gate-help">Introduza o código que lhe foi enviado. Esta área não é pública.</p>
    <label for="gate-code">Código</label>
    <input id="gate-code" type="password" autocomplete="current-password" placeholder="Código de acesso">
    <div style="margin-top:14px">
      <button type="button" id="gate-submit" class="btn" style="width:100%">Entrar</button>
    </div>
    <div class="err" id="gate-err"></div>
  </div>

  <div id="view-app" class="hidden">
    <div class="toolbar no-print">
      <strong style="color:#0f172a">Pimo Casa</strong>
      <span class="chip" id="role-chip"></span>
      <span class="spacer"></span>
      <button type="button" class="btn secondary" id="btn-refresh">Actualizar</button>
      <button type="button" class="btn secondary" id="btn-print">Imprimir / PDF</button>
      <button type="button" class="btn secondary" id="btn-logout">Sair</button>
    </div>
    <div class="layout">
      <aside class="side no-print" id="side-panel"></aside>
      <main class="main" id="main-panel"></main>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var I18N = {
    pt: {
      access: "Acesso ao orçamento",
      adminAccess: "Painel de controlo",
      enterCode: "Introduza o código que lhe foi enviado. Esta área não é pública.",
      adminHelp: "Acesso reservado. Introduza o código de administração.",
      code: "Código",
      enter: "Entrar",
      projects: "Projectos",
      newProject: "Novo projecto",
      importJson: "Importar JSON",
      duplicate: "Duplicar",
      archive: "Arquivar",
      links: "Ligações e códigos",
      history: "Histórico",
      backup: "Cópia de segurança",
      save: "Gravar",
      sendChoice: "Enviar escolha",
      finalPrice: "Preço final",
      withInstall: "Com montagem",
      withEquip: "Com equipamentos",
      material: "Gama de material",
      sobConsulta: "sob consulta",
      aOrcamentar: "a orçamentar",
      esgotado: "esgotado",
      noPrice: "Preço de venda ainda não definido.",
      disclaimer: "Documento elaborado pela Pimo Casa. Preços de terceiros sujeitos a alteração e a confirmação no acto da encomenda. Sem valor de fatura.",
      regards: "Com os melhores cumprimentos,"
    },
    en: {},
    fr: {}
  };
  var lang = "pt";
  function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.pt[key] || key; }

  var state = {
    me: null,
    token: new URLSearchParams(location.search).get("v") || "",
    projects: [],
    projectId: null,
    project: null,
    data: null,
    versions: [],
    links: [],
    printHide: {}
  };

  // Absolute so /orcamentos/<slug>/ still hits the API
  var BASE = "/orcamentos/api";
  var APP_ROOT = "/orcamentos/";

  function pathSlug() {
    var m = String(location.pathname || "").match(/^\/orcamentos\/([a-z0-9][a-z0-9-]*)\/?$/i);
    if (!m) return "";
    var s = m[1].toLowerCase();
    if (s === "api") return "";
    return s;
  }

  function projectPublicPath(slug, withToken) {
    if (!slug) return APP_ROOT + (withToken && state.token ? ("?v=" + encodeURIComponent(state.token)) : "");
    var p = APP_ROOT + encodeURIComponent(slug) + "/";
    if (withToken && state.token) p += "?v=" + encodeURIComponent(state.token);
    return p;
  }

  function syncUrlForProject(proj, replace) {
    if (!proj || !proj.slug) return;
    var next = projectPublicPath(proj.slug, !!state.token);
    var wantPath = APP_ROOT + encodeURIComponent(proj.slug) + "/";
    var here = location.pathname.replace(/\/?$/, "/");
    var tokenOk = !state.token || /[?&]v=/.test(location.search);
    if (here === wantPath && tokenOk) return;
    if (replace) history.replaceState({ slug: proj.slug }, "", next);
    else history.pushState({ slug: proj.slug }, "", next);
  }

  function goRoot(replace) {
    var next = APP_ROOT + (state.token ? ("?v=" + encodeURIComponent(state.token)) : "");
    if (replace) history.replaceState({}, "", next);
    else history.pushState({}, "", next);
  }

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function money(v, empty) {
    if (v == null || v === "") return empty || "-";
    var n = Number(v);
    if (isNaN(n)) return String(v);
    return n.toLocaleString("pt-PT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }

  function priceStatusLabel(st) {
    if (!st) return "";
    if (st === "sob_consulta") return t("sobConsulta");
    if (st === "a_orcamentar" || st === "a_orçamentar") return t("aOrcamentar");
    if (st === "esgotado") return t("esgotado");
    return st;
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    if (!(opts.body instanceof FormData)) {
      headers["Content-Type"] = headers["Content-Type"] || "application/json";
    }
    return fetch(BASE + "/" + path, {
      method: opts.method || "GET",
      credentials: "same-origin",
      headers: headers,
      body: opts.body ? (opts.body instanceof FormData ? opts.body : JSON.stringify(opts.body)) : undefined
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.ok === false) {
          var err = new Error((j && j.error) || "Pedido falhou");
          err.status = r.status;
          throw err;
        }
        return j;
      });
    });
  }

  function assetUrl(ref) {
    if (!ref) return null;
    if (String(ref).indexOf("upload:") === 0) {
      return BASE + "/file.php?id=" + encodeURIComponent(String(ref).slice(7));
    }
    if (String(ref).indexOf("http") === 0) return ref;
    return null;
  }

  function showGate() {
    document.getElementById("view-gate").classList.remove("hidden");
    document.getElementById("view-app").classList.add("hidden");
    var isAdmin = !state.token;
    document.getElementById("gate-title").textContent = isAdmin ? t("adminAccess") : t("access");
    document.getElementById("gate-help").textContent = isAdmin ? t("adminHelp") : t("enterCode");
  }

  function showApp() {
    document.getElementById("view-gate").classList.add("hidden");
    document.getElementById("view-app").classList.remove("hidden");
    var role = state.me.role;
    var labels = {
      admin: "Painel de controlo",
      khaled: "Vista completa",
      filipe: "Vista de edição",
      factory: "Vista de fábrica",
      client: "Vista de cliente"
    };
    document.getElementById("role-chip").textContent = labels[role] || role;
    render();
  }

  function boot() {
    api("me.php").then(function (j) {
      if (j.authenticated) {
        state.me = j;
        showApp();
        return loadWorkspace();
      }
      showGate();
    }).catch(function () {
      showGate();
      document.getElementById("gate-err").textContent =
        "O serviço ainda não está configurado neste servidor.";
    });
  }

  document.getElementById("gate-submit").addEventListener("click", doLogin);
  document.getElementById("gate-code").addEventListener("keydown", function (e) {
    if (e.key === "Enter") doLogin();
  });

  function doLogin() {
    var code = document.getElementById("gate-code").value.trim();
    var err = document.getElementById("gate-err");
    err.textContent = "";
    if (!code) { err.textContent = "Indique o código."; return; }
    var body = state.token
      ? { code: code, token: state.token, mode: "link" }
      : { code: code, mode: "admin" };
    api("login.php", { method: "POST", body: body }).then(function (j) {
      state.me = j;
      showApp();
      return loadWorkspace();
    }).catch(function (e) {
      err.textContent = e.message || "Falha no acesso.";
    });
  }

  document.getElementById("btn-logout").addEventListener("click", function () {
    api("logout.php", { method: "POST", body: {} }).finally(function () {
      state.me = null; state.project = null; state.data = null;
      showGate();
    });
  });
  document.getElementById("btn-refresh").addEventListener("click", function () {
    loadWorkspace().then(function () { toast("Actualizado"); });
  });
  document.getElementById("btn-print").addEventListener("click", function () {
    window.print();
  });

  function loadAdminCodes() {
    return api("admin-codes.php").then(function (j) {
      state.adminCodes = j.codes || [];
    }).catch(function () {
      state.adminCodes = state.adminCodes || [];
    });
  }

  function loadWorkspace() {
    var role = state.me.role;
    var slug = pathSlug();
    if (role === "admin") {
      return api("projects.php").then(function (j) {
        state.projects = j.projects || [];
        return loadAdminCodes().then(function () {
          if (slug) {
            var match = state.projects.find(function (p) { return p.slug === slug; });
            if (match) return openProject(match.id, { syncUrl: true, replace: true });
            toast("Projecto não encontrado: " + slug);
            state.projectId = null;
            state.project = null;
            state.data = null;
            goRoot(true);
            render();
            return;
          }
          // /orcamentos/ — lista com links próprios (não abrir automaticamente)
          state.projectId = null;
          state.project = null;
          state.data = null;
          render();
        });
      });
    }
    if (state.me.project_id) {
      state.projectId = state.me.project_id;
      return openProject(state.projectId, { syncUrl: true, replace: true });
    }
    render();
    return Promise.resolve();
  }

  function openProject(id, opts) {
    opts = opts || {};
    state.projectId = id;
    return api("project.php?id=" + encodeURIComponent(id)).then(function (j) {
      state.project = j.project;
      state.data = j.project.data;
      if (opts.syncUrl !== false) syncUrlForProject(j.project, !!opts.replace);
      render();
      if (state.me.role === "admin") {
        return Promise.all([
          api("access.php?project_id=" + encodeURIComponent(id)).then(function (a) { state.links = a.links || []; }),
          api("versions.php?project_id=" + encodeURIComponent(id)).then(function (v) { state.versions = v.versions || []; })
        ]).then(function () { render(); });
      }
      if (state.me.role === "khaled") {
        return api("versions.php?project_id=" + encodeURIComponent(id)).then(function (v) {
          state.versions = v.versions || [];
          render();
        });
      }
    }).catch(function (e) {
      toast(e.message);
    });
  }

  window.addEventListener("popstate", function () {
    if (!state.me) return;

  function statusLabel(s) {
    var map = {
      rascunho: "Rascunho",
      enviado_fabricas: "Enviado às fábricas",
      precos_fabricas: "Preços das fábricas recebidos",

  function renderSide() {
    var el = document.getElementById("side-panel");
    var role = state.me.role;
    if (role !== "admin") {
      el.innerHTML = "<h2>Orçamento</h2><p class=\"note\">" + esc((state.project && state.project.title) || "") + "</p>";
      return;
    }
    var html = "<h2>" + t("projects") + "</h2>";
    html += "<div class=\"row\" style=\"margin-bottom:12px\">";
    html += "<button type=\"button\" class=\"btn\" id=\"btn-new\">" + t("newProject") + "</button>";
    html += "<button type=\"button\" class=\"btn secondary\" id=\"btn-import\">" + t("importJson") + "</button>";
    html += "</div><input type=\"file\" id=\"import-file\" accept=\"application/json,.json\" class=\"hidden\">";
    if (!state.projectId) {
      html += "<p class=\"note\">Escolha um projecto pelo link próprio, ou crie/importe um novo.</p>";
    } else {
      html += "<p class=\"cap\" style=\"margin-bottom:8px\"><a href=\"" + esc(APP_ROOT) + "\" id=\"btn-all-projects\">← Todos os projectos</a></p>";
    }
    (state.projects || []).forEach(function (p) {
      var href = projectPublicPath(p.slug, false);
      html += "<div class=\"proj" + (p.id === state.projectId ? " active" : "") + "\" data-id=\"" + esc(p.id) + "\" data-slug=\"" + esc(p.slug || "") + "\">";
      html += "<div class=\"t\">" + esc(p.title) + "</div>";
      html += "<div class=\"m\">" + esc(statusLabel(p.status)) + " · " + esc(p.updated_at || "") + "</div>";
      html += "<div class=\"m\" style=\"word-break:break-all\"><a class=\"proj-link\" href=\"" + esc(href) + "\">/orcamentos/" + esc(p.slug || "") + "/</a></div></div>";
    });
    if (!(state.projects || []).length) {
      html += "<p class=\"note\">Ainda sem projectos. Crie ou importe um para obter o link por slug.</p>";
    }
    el.innerHTML = html;
    var allBtn = document.getElementById("btn-all-projects");
    if (allBtn) {
      allBtn.addEventListener("click", function (e) {
        e.preventDefault();
        state.projectId = null;
        state.project = null;
        state.data = null;
        goRoot(false);
        render();
      });
    }
    el.querySelectorAll(".proj").forEach(function (n) {
      n.addEventListener("click", function (e) {
        if (e.target && e.target.classList && e.target.classList.contains("proj-link")) {
          e.preventDefault();
        }
        openProject(n.getAttribute("data-id"), { syncUrl: true });
      });
    });
    var btnNew = document.getElementById("btn-new");
    if (btnNew) btnNew.addEventListener("click", createEmpty);
    var btnImp = document.getElementById("btn-import");
    var fileImp = document.getElementById("import-file");
    if (btnImp && fileImp) {
      btnImp.addEventListener("click", function () { fileImp.click(); });
      fileImp.addEventListener("change", function () {
        var f = fileImp.files && fileImp.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var data = JSON.parse(String(reader.result || ""));
            var payload = state.projectId
              ? { project_id: state.projectId, data: data }
              : data;
            api("import.php", { method: "POST", body: payload }).then(function (j) {
              toast(j.updated ? "Importado (nova versão)" : "Importado");
              state.projectId = j.project.id;
              return openProject(j.project.id, { syncUrl: true, replace: false }).then(function () {
                return api("projects.php").then(function (pj) { state.projects = pj.projects || []; render(); });
              });
            }).catch(function (e) { toast(e.message); });
          } catch (err) {
            toast("JSON inválido");
          }
        };
        reader.readAsText(f);
        fileImp.value = "";
      });
    }
  }

  function renderComparePanel(d) {
    var quotes = d.factory_quotes || {};
    var keys = Object.keys(quotes);
    if (!keys.length) {
      return "<div class=\"panel no-print\"><h3>Comparação de fábricas</h3><p class=\"note\">Ainda sem cotações.</p></div>";
    }
    var boxes = d.boxes || [];
    var html = "<div class=\"panel no-print\"><h3>Comparação de fábricas</h3>";
    html += "<table class=\"t compare\"><thead><tr><th>Caixa</th>";
    keys.forEach(function (k) { html += "<th>" + esc(quotes[k].factory_name || k) + "</th>"; });
    html += "<th>Aprovado</th></tr></thead><tbody>";
    boxes.forEach(function (b) {
      var code = b.code;
      html += "<tr><td>" + esc(code + " · " + (b.name || "")) + "</td>";
      keys.forEach(function (k) {
        var price = quotes[k].boxes && quotes[k].boxes[code] ? quotes[k].boxes[code].price_eur : null;
        var approved = d.approved_prices && d.approved_prices[code];
        var cls = approved && approved.factory_key === k ? " pick picked" : " pick";
        html += "<td class=\"" + cls.trim() + "\" data-item=\"" + esc(code) + "\" data-factory=\"" + esc(k) + "\" data-price=\"" + esc(price == null ? "" : price) + "\">" + esc(money(price, "-")) + "</td>";
      });
      var ap = d.approved_prices && d.approved_prices[code];
      html += "<td>" + (ap ? esc(ap.factory_key) + " · " + esc(money(ap.price_eur)) : "-") + "</td></tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function clientPriceLabel(d, choice) {
    var pricing = d.pricing || {};
    if (!pricing.approved || pricing.selling_price_per_unit_eur == null) return "Preço em preparação";

  function renderReport(editable) {
    var d = state.data;
    if (!d) return "<div class=\"report\"><p class=\"note\">Sem dados.</p></div>";
    var role = state.me.role;
    if (role === "client") return renderClientView();
    var company = d.company || {};
    var project = d.project || {};
    var units = project.units || 1;

    function sec(id, inner) {
      return "<section class=\"doc-sec\" data-sec=\"" + id + "\">" + inner + "</section>";
    }

    var html = "<article class=\"report\" id=\"report\">";
    var canEdit = editable && (role === "admin" || role === "khaled" || role === "filipe");
    var isInternal = role === "admin" || role === "khaled" || role === "filipe";
    var isFactory = role === "factory";

    // 1 Capa
    var coverRows = [
      ["Projecto", project.name],
      ["Unidades", units ? units + " unidades" : ""],
      ["Empresa", company.brand || "Pimo Casa"],
      ["Medidas gerais", overallTxt(project)],
      ["N.º", (state.project && state.project.slug) || project.id || ""]
    ];
    if (!isFactory) {
      coverRows.splice(1, 0,
        ["Cliente", (project.client && project.client.name) || ""],
        ["Local", project.location || (project.client && project.client.country) || ""]
      );
      coverRows.splice(5, 0, ["Data", (d.prices_checked_at || d.generated_at || "")]);
    }
    html += sec("capa",
      hdrHtml(d) +
      "<h1 class=\"doc\">" + esc(project.name || state.project.title || "Orçamento") + "</h1>" +
      infoTable(coverRows)
    );

    // 2 Resumo
    html += sec("resumo",
      "<h2 class=\"sec\">1. Resumo do projecto</h2>" +
      "<p>" + esc(project.notes || "") + "</p>" +
      listHtml(project.assumptions)
    );

    // 3 Design / renders
    html += sec("design",
      "<div class=\"pagebreak\"></div><h2 class=\"sec\">2. Design e planta</h2>" +
      designAssetsHtml(d.assets || {}, role)
    );

    // 4 Caixas (+ box_costs nas vistas internas)
    html += sec("caixas",
      "<h2 class=\"sec\">3. Caixas do móvel</h2>" +
      techAssetsHtml(d.assets || {}, d.boxes || [], role) +
      boxesTable(d.boxes || [], role) +
      (role === "factory" ? factoryPartsHtml(d) : "") +
      rematesHtml(d, role) +
      doorsInDesignHtml(d, role) +
      partsSheetsHtml(d, role) +
      (isInternal ? boxCostsHtml(d, canEdit) : "") +
      (isInternal ? checksAConfirmarHtml(d) : "")
    );

    // Categories / items (mostrar secções vazias se editável)
    var cats = d.categories || [];
    var byCat = {};
    (d.items || []).forEach(function (it, idx) {
      if (it.archived) return;
      it._idx = idx;
      var c = it.category || "outros";
      (byCat[c] = byCat[c] || []).push(it);
    });
    var catSec = {
      dobradicas: ["dobradicas", "4. Dobradiças"],
      puxadores: ["puxadores", "4b. Puxadores"],
      sistemas_portas: ["portas", "5. Portas / sistema de abertura"],
      eletrodomesticos: ["equipamentos", "6. Equipamentos"],
      ventilacao: ["ventilacao", "7. Ventilação e distâncias"],
      outros: ["equipamentos", "6b. Outros"]
    };
    var seenCat = {};
    cats.forEach(function (c) {
      var items = byCat[c.id] || [];
      if (!items.length && !canEdit) return;
      seenCat[c.id] = true;
      var meta = catSec[c.id] || [c.id, c.name];
      html += sec(meta[0],
        "<h2 class=\"sec\">" + esc(meta[1] || c.name) + "</h2>" +
        itemsTable(items, role, canEdit, c.id)
      );
    });
    Object.keys(catSec).forEach(function (cid) {
      if (seenCat[cid] || !canEdit) return;
      if (!(byCat[cid] || []).length) {
        html += sec(catSec[cid][0],
          "<h2 class=\"sec\">" + esc(catSec[cid][1]) + "</h2>" +
          itemsTable([], role, canEdit, cid)
        );
      }
    });

    // Montagem (não na fábrica — sem preços)
    if (!isFactory) {
      html += sec("montagem",
        "<div class=\"pagebreak\"></div><h2 class=\"sec\">8. Montagem e transporte</h2>" +
        montagemBlock(d, role)
      );
    }

    // Totais (internas: resumo vivo; fábrica: sem totais)
    if (isInternal) {
      html += sec("totais",
        "<h2 class=\"sec\">9. Resumo de totais</h2>" +
        grandTotalsHtml(d)
      );
    } else if (!isFactory) {
      html += sec("totais",
        "<h2 class=\"sec\">9. Resumo de totais</h2>" +
        totaisBlock(d, role)
      );
    }

    // Condições / pontos a confirmar — só internas (fábrica: só especificações)
    if (!isFactory) {
      html += sec("condicoes",
        "<h2 class=\"sec\">10. Condições</h2>" +
        "<p class=\"note\">Prazo, pagamento e validade a confirmar no fecho da encomenda.</p>" +
        ((d.points_to_confirm && d.points_to_confirm.length)
          ? ("<h3 class=\"sub\">Pontos a confirmar</h3>" + listHtml(d.points_to_confirm))
          : "")
      );
    }

    // Gaps only Khaled views
    if (d.gaps && d.gaps.length && isInternal) {
      html += sec("gaps",
        "<h2 class=\"sec\">Lacunas</h2>" + listHtml(d.gaps)
      );
    }

    // Assinatura (internas); fábrica fica só com especificações + imagens
    if (!isFactory) {
      html += sec("assinatura",
        "<p class=\"cap\">" + esc(d.disclaimer_pt || t("disclaimer")) + "</p>" +
        "<div class=\"sig\">" + esc(t("regards")) +
        "<strong>" + esc(company.signer || "Khaled al Ahdab") + "</strong>" +
        esc(company.brand || "Pimo Casa") + "<br>" +
        esc(company.email || "info@pimo.pt") + "<br>" +
        esc(company.phone || "+351 913 822 833") + "<br>" +
        esc(company.web || "www.pimo.pt") +
        "</div>"
      );
    }

    html += "</article>";
    return html;
  }

  function computeBoxTotals(d) {
    var bc = d.box_costs || {};
    var rate = bc.iva_rate != null ? Number(bc.iva_rate) : 0.23;
    var units = bc.units || (d.project && d.project.units) || 1;
    var aKeys = bc.a_definir_keys || [];
    var pending = [];
    var sub_u = 0, sub_p = 0;
    (bc.lines || []).forEach(function (line) {
      if (line.archived) return;
      var isADef = line.flag === "a_definir" || (aKeys.indexOf(line.key) >= 0);
      var pu = line.per_unit_eur;
      var pr = line.project_eur;
      if (isADef && pu == null && pr == null) {
        pending.push(line.label || line.key);
        return;
      }
      if (line.key === "adm") {
        if (pr != null) sub_p += Number(pr) || 0;
        else if (pu != null) sub_p += Number(pu) || 0;
        return;
      }
      if (pu != null) sub_u += Number(pu) || 0;
      if (pr != null) sub_p += Number(pr) || 0;
      else if (pu != null) sub_p += (Number(pu) || 0) * units;
    });
    (bc.panels || []).forEach(function (p) {
      if (p.archived) return;
      var pu = p.per_unit_eur != null ? Number(p.per_unit_eur) : (p.unit_price_eur != null && p.qty_per_unit != null ? Number(p.unit_price_eur) * Number(p.qty_per_unit) : 0);
      var pr = p.project_eur != null ? Number(p.project_eur) : pu * units;
      sub_u += pu || 0;
      sub_p += pr || 0;
    });
    (bc.hardware || []).forEach(function (h) {
      if (h.archived) return;
      var pu = h.per_unit_eur != null ? Number(h.per_unit_eur) : (h.unit_price_eur != null && h.qty_per_unit != null ? Number(h.unit_price_eur) * Number(h.qty_per_unit) : 0);
      var pr = h.project_eur != null ? Number(h.project_eur) : pu * units;
      sub_u += pu || 0;
      sub_p += pr || 0;
    });
    (d.items || []).forEach(function (it) {
      if (it.archived) return;
      var q = it.qty_per_unit != null ? Number(it.qty_per_unit) : 0;
      var price = it.unit_price_eur != null ? Number(it.unit_price_eur) : 0;
      var pu = q * price;
      sub_u += pu;
      sub_p += pu * units;
    });
    return {
      pending: pending,
      sub_u: sub_u,
      sub_p: sub_p,
      iva_u: sub_u * rate,
      iva_p: sub_p * rate,
      tot_u: sub_u * (1 + rate),
      tot_p: sub_p * (1 + rate),
      rate: rate,
      units: units
    };
  }

  function syncDerivedRowTotals() {
    var units = (state.data && state.data.box_costs && state.data.box_costs.units)
      || (state.data && state.data.project && state.data.project.units) || 1;
    function syncSection(prefix) {
      var i = 0;
      while (document.querySelector('[data-ed="' + prefix + i + '.qty_per_unit"]')
        || document.querySelector('[data-ed="' + prefix + i + '.unit_price_eur"]')) {
        var qty = edVal(prefix + i + ".qty_per_unit");
        var price = edVal(prefix + i + ".unit_price_eur");
        if (qty != null && price != null) {
          var pu = qty * price;
          edSet(prefix + i + ".per_unit_eur", pu);
          edSet(prefix + i + ".project_eur", pu * units);
          if (edVal(prefix + i + ".qty_project") == null) {
            edSet(prefix + i + ".qty_project", qty * units);
          }
        }
        i++;
      }
    }
    syncSection("box_costs.panels.");
    syncSection("box_costs.hardware.");
    var li = 0;
    while (document.querySelector('[data-ed="box_costs.lines.' + li + '.per_unit_eur"]')) {
      var puL = edVal("box_costs.lines." + li + ".per_unit_eur");
      var keyInp = document.querySelector('[data-ed="box_costs.lines.' + li + '.label"]');
      var isAdm = keyInp && /administra|adm/i.test(keyInp.value || "");
      if (puL != null && !isAdm && edVal("box_costs.lines." + li + ".project_eur") == null) {
        edSet("box_costs.lines." + li + ".project_eur", puL * units);
      }
      li++;
    }
    var ii = 0;
    while (document.querySelector('[data-ed="items.' + ii + '.qty_per_unit"]')) {
      var q = edVal("items." + ii + ".qty_per_unit");
      if (q != null && edVal("items." + ii + ".qty_project") == null) {
        edSet("items." + ii + ".qty_project", q * units);
      }
      ii++;
    }
  }

  function parseNum(raw) {
    if (raw == null) return null;
    var s = String(raw).trim();
    if (s === "") return null;
    var n = Number(s.replace(",", "."));
    return isNaN(n) ? null : n;
  }

  function setByPath(obj, path, value) {
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      var p = parts[i];
      var next = parts[i + 1];
      var idx = /^\d+$/.test(p) ? Number(p) : p;
      if (cur[idx] == null) cur[idx] = /^\d+$/.test(next) ? [] : {};
      cur = cur[idx];
    }
    var last = parts[parts.length - 1];
    var key = /^\d+$/.test(last) ? Number(last) : last;
    if (/_eur$|_mm$|qty_|per_unit|project_eur|unit_price|thickness/.test(String(key)) || key === "qty_per_unit" || key === "qty_project") {
      cur[key] = parseNum(value);
    } else {
      cur[key] = value;
    }
  }

  function collectEditorToData(d) {
    d.box_costs = d.box_costs || { lines: [], panels: [], hardware: [], units: (d.project && d.project.units) || 1, iva_rate: 0.23 };
    d.pricing_placeholders = d.pricing_placeholders || {};
    d.items = d.items || [];
    var units = d.box_costs.units || (d.project && d.project.units) || 1;
    document.querySelectorAll("[data-ed]").forEach(function (inp) {
      setByPath(d, inp.getAttribute("data-ed"), inp.value);
    });
    (d.box_costs.lines || []).forEach(function (line) {
      if (line.archived) return;
      var aKeys = d.box_costs.a_definir_keys || [];
      var isKey = aKeys.indexOf(line.key) >= 0;
      if (line.per_unit_eur == null && line.project_eur == null && (isKey || line.flag === "a_definir")) {
        line.flag = "a_definir";
        line.render = "red";
      } else if (line.per_unit_eur != null || line.project_eur != null) {
        if (line.key !== "adm" && line.per_unit_eur != null && line.project_eur == null) {
          line.project_eur = Number(line.per_unit_eur) * units;
        }
        line.flag = "ok";
        line.render = "normal";
      }
      if (line.key === "margem") d.pricing_placeholders.margin_amount_eur = line.per_unit_eur;
      if (line.key === "portes") {
        d.pricing_placeholders.shipping_per_unit_eur = line.per_unit_eur;
        d.pricing_placeholders.shipping_x6_eur = line.project_eur;
      }
      if (line.key === "montagem") {
        d.pricing_placeholders.installation_per_unit_eur = line.per_unit_eur;
        d.pricing_placeholders.installation_x6_eur = line.project_eur;
      }
      if (line.key === "mao_de_obra") {
        d.pricing_placeholders.fabrication_per_unit_eur = line.per_unit_eur;
        d.pricing_placeholders.fabrication_x6_eur = line.project_eur;
      }
      if (line.key === "design") {
        d.pricing_placeholders.design_per_unit_eur = line.per_unit_eur;
        d.pricing_placeholders.design_x6_eur = line.project_eur;
      }
      if (line.key === "adm") d.pricing_placeholders.adm_project_eur = line.project_eur != null ? line.project_eur : line.per_unit_eur;
    });
    (d.box_costs.panels || []).forEach(function (p) {
      if (p.archived) return;
      if (p.unit_price_eur != null && p.qty_per_unit != null && p.per_unit_eur == null) {
        p.per_unit_eur = Number(p.unit_price_eur) * Number(p.qty_per_unit);
      }
      if (p.per_unit_eur != null && p.project_eur == null) p.project_eur = Number(p.per_unit_eur) * units;
      if (p.qty_per_unit != null && p.qty_project == null) p.qty_project = Number(p.qty_per_unit) * units;
    });
    (d.box_costs.hardware || []).forEach(function (h) {
      if (h.archived) return;
      if (h.unit_price_eur != null && h.qty_per_unit != null && h.per_unit_eur == null) {
        h.per_unit_eur = Number(h.unit_price_eur) * Number(h.qty_per_unit);
      }
      if (h.per_unit_eur != null && h.project_eur == null) h.project_eur = Number(h.per_unit_eur) * units;
      if (h.qty_per_unit != null && h.qty_project == null) h.qty_project = Number(h.qty_per_unit) * units;
    });
    (d.items || []).forEach(function (it) {
      if (it.archived) return;
      if (it.qty_per_unit != null && it.qty_project == null) it.qty_project = Number(it.qty_per_unit) * units;
    });
    var tot = computeBoxTotals(d);
    d.box_costs.totals = d.box_costs.totals || {};
    d.box_costs.totals.subtotal_ex_iva = { per_unit: tot.sub_u, project: tot.sub_p };
    d.box_costs.totals.iva = { per_unit: tot.iva_u, project: tot.iva_p };
    d.box_costs.totals.total_incl_iva = { per_unit: tot.tot_u, project: tot.tot_p };
    return d;
  }

    ]);
    if (d.order_of_magnitude && d.order_of_magnitude.length) {
      html += "<h3 class=\"sub\">Ordem de grandeza (compra)</h3><table class=\"t\"><thead><tr><th>Conjunto</th><th class=\"n\">/ un.</th><th class=\"n\">Total</th></tr></thead><tbody>";
      d.order_of_magnitude.forEach(function (o) {
        html += "<tr><td>" + esc(o.label) + "</td><td class=\"n\">" + esc(money(o.per_unit_eur)) + "</td><td class=\"n\">" + esc(money(o.x6_eur)) + "</td></tr>";
      });
      html += "</tbody></table>";
    }
    return html;
  }

  function bindAdminCode() {
    var btn = document.getElementById("adm-code-save");
    if (btn) {
      btn.addEventListener("click", function () {
        var err = document.getElementById("adm-code-err");
        err.textContent = "";
        var current = document.getElementById("adm-code-current").value;
        var neu = document.getElementById("adm-code-new").value;
        var conf = document.getElementById("adm-code-confirm").value;
        if (!current || !neu || !conf) {
          err.textContent = "Preencha todos os campos.";
          return;
        }
        if (neu.length < 10) {
          err.textContent = "O novo código deve ter pelo menos 10 caracteres.";
          return;
        }
        if (neu !== conf) {
          err.textContent = "A confirmação do novo código não coincide.";
          return;
        }
        api("admin-code.php", {
          method: "POST",
          body: { current_code: current, new_code: neu, confirm_code: conf }
        }).then(function () {
          document.getElementById("adm-code-current").value = "";
          document.getElementById("adm-code-new").value = "";
          document.getElementById("adm-code-confirm").value = "";
          toast("Código de administrador actualizado");
        }).catch(function (e) {
          err.textContent = e.message || "Falha ao actualizar.";
        });
      });
    }
    bindExtraAdminCodes();
  }

  function bindExtraAdminCodes() {
    var create = document.getElementById("adm-extra-create");
    if (create) {
      create.addEventListener("click", function () {
        var err = document.getElementById("adm-extra-err");
        err.textContent = "";
        var label = document.getElementById("adm-extra-label").value.trim();
        var code = document.getElementById("adm-extra-code").value;
        if (!label || !code) {
          err.textContent = "Indique etiqueta e código.";
          return;
        }
        if (code.length < 10) {
          err.textContent = "O código deve ter pelo menos 10 caracteres.";
          return;
        }
        api("admin-codes.php", {
          method: "POST",
          body: { action: "create", label: label, code: code }
        }).then(function () {
          document.getElementById("adm-extra-label").value = "";
          document.getElementById("adm-extra-code").value = "";
          toast("Código adicional criado");
          return loadAdminCodes().then(function () { render(); });
        }).catch(function (e) {
          err.textContent = e.message || "Falha ao criar.";
        });
      });
    }
    document.querySelectorAll(".adm-extra-rev").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!confirm("Revogar este código adicional?")) return;
        api("admin-codes.php", {
          method: "POST",
          body: { action: "revoke", id: btn.getAttribute("data-id") }
        }).then(function () {
          toast("Código revogado");
          return loadAdminCodes().then(function () { render(); });
        }).catch(function (e) { toast(e.message); });
      });
    });
  }

  function saveEditorData(note) {
    collectEditorToData(state.data);
    return api("project.php", {
      method: "POST",
      body: { id: state.projectId, data: state.data, note: note || "edição" }
    }).then(function () {
      toast("Gravado");
      return openProject(state.projectId);
    });
  }

  function bindADefinirSave() {
    var btn = document.getElementById("btn-save-adef");
    if (btn) {
      btn.addEventListener("click", function () {
        saveEditorData("edição custos / linhas").catch(function (e) { toast(e.message); });
      });
    }
    bindEditorExtras();
    bindLiveTotals();
  }

  function bindEditorExtras() {
    var units = (state.data.box_costs && state.data.box_costs.units) || (state.data.project && state.data.project.units) || 1;
    document.querySelectorAll(".ed-archive").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!confirm("Remover (arquivar) esta linha?")) return;
        collectEditorToData(state.data);
        var path = btn.getAttribute("data-path");
        var i = Number(btn.getAttribute("data-i"));
        var arr = path === "items" ? state.data.items : path.split(".").reduce(function (o, k) { return o[k]; }, state.data);
        if (arr && arr[i]) arr[i].archived = true;
        saveEditorData("remover linha").catch(function (e) { toast(e.message); });
      });
    });
    var addLine = document.getElementById("btn-add-cost-line");
    if (addLine) addLine.addEventListener("click", function () {
      collectEditorToData(state.data);
      state.data.box_costs = state.data.box_costs || { lines: [] };
      state.data.box_costs.lines = state.data.box_costs.lines || [];
      state.data.box_costs.lines.push({
        key: "extra_" + Date.now(),
        label: "Nova rubrica",
        per_unit_eur: null,
        project_eur: null,
        flag: "ok",
        render: "normal",
        visibility: "internal_only"
      });
      saveEditorData("adicionar linha de custo").catch(function (e) { toast(e.message); });
    });
    var addPanel = document.getElementById("btn-add-panel");
    if (addPanel) addPanel.addEventListener("click", function () {
      collectEditorToData(state.data);
      state.data.box_costs.panels = state.data.box_costs.panels || [];
      state.data.box_costs.panels.push({ material: "Novo painel", thickness_mm: 19, qty_per_unit: 1, qty_project: units, unit_price_eur: null, per_unit_eur: null, project_eur: null });
      saveEditorData("adicionar painel").catch(function (e) { toast(e.message); });
    });
    var addHw = document.getElementById("btn-add-hw");
    if (addHw) addHw.addEventListener("click", function () {
      collectEditorToData(state.data);
      state.data.box_costs.hardware = state.data.box_costs.hardware || [];
      state.data.box_costs.hardware.push({ type: "Nova ferragem", qty_per_unit: 1, qty_project: units, unit_price_eur: null, per_unit_eur: null, project_eur: null, notes: "" });
      saveEditorData("adicionar ferragem").catch(function (e) { toast(e.message); });
    });
    document.querySelectorAll(".ed-add-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        collectEditorToData(state.data);
        var cat = btn.getAttribute("data-cat") || "outros";
        state.data.items = state.data.items || [];
        state.data.items.push({
          id: "item-" + Date.now(),
          category: cat,
          kind: cat,
          name: "Novo artigo",
          model: "",
          notes_pt: "",
          supplier: "",
          url: null,
          unit_price_eur: null,
          qty_per_unit: 1,
          qty_project: units,
          price_status: null
        });
        var cats = state.data.categories || [];
        if (!cats.some(function (c) { return c.id === cat; })) {
          cats.push({ id: cat, name: cat });
          state.data.categories = cats;
        }
        saveEditorData("adicionar artigo").catch(function (e) { toast(e.message); });
      });
    });
  }

  function bindAdmin() {
    bindAdminCode();
    bindADefinirSave();
    var st = document.getElementById("adm-save-status");
    if (st) st.addEventListener("click", function () {
      var status = document.getElementById("adm-status").value;
      api("project.php", { method: "POST", body: { id: state.projectId, data: state.data, status: status, note: "estado" } })
        .then(function () { toast("Estado actualizado"); return loadWorkspace(); })
        .catch(function (e) { toast(e.message); });
    });
    var dup = document.getElementById("adm-dup");
    if (dup) dup.addEventListener("click", function () {
      api("duplicate.php", { method: "POST", body: { id: state.projectId } })
        .then(function (j) {
          toast("Duplicado");
          return api("projects.php").then(function (pj) {
            state.projects = pj.projects || [];
            return openProject(j.project.id, { syncUrl: true });
          });
        })
        .catch(function (e) { toast(e.message); });
    });
    var arch = document.getElementById("adm-arch");
    if (arch) arch.addEventListener("click", function () {
      if (!confirm("Arquivar este projecto?")) return;
      api("project.php", { method: "DELETE", body: { id: state.projectId } })
        .then(function () {
          state.projectId = null;
          state.project = null;
          state.data = null;
          toast("Arquivado");
          goRoot(true);
          return loadWorkspace();
        })
        .catch(function (e) { toast(e.message); });
    });
    var bak = document.getElementById("adm-backup");
    if (bak) bak.addEventListener("click", function () {
      api("backup.php", { method: "POST", body: {} }).then(function (j) {
        toast(j.created ? "Cópia criada" : "Cópia do dia já existia");
      }).catch(function (e) { toast(e.message); });
    });
    document.querySelectorAll(".adm-upload").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        var fd = new FormData();
        fd.append("file", f);
        fd.append("project_id", state.projectId);
        fd.append("kind", inp.getAttribute("data-kind") || "image");
        var cat = inp.getAttribute("data-category");
        var akey = inp.getAttribute("data-asset-key");
        if (cat) fd.append("category", cat);
        if (akey) fd.append("asset_key", akey);
        fetch(BASE + "/upload.php", { method: "POST", credentials: "same-origin", body: fd })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (!j.ok) throw new Error(j.error || "Falha");
            toast("Imagem enviada");
            return openProject(state.projectId);
          })
          .catch(function (e) { toast(e.message); });
      });
    });
    var boxUp = document.getElementById("adm-box-asset-up");
    if (boxUp) {
      boxUp.addEventListener("click", function () {
        var code = (document.getElementById("adm-box-asset-code").value || "").trim();
        var fileInp = document.getElementById("adm-box-asset-file");
        var f = fileInp && fileInp.files && fileInp.files[0];
        if (!code || !f) { toast("Indique a caixa e o ficheiro"); return; }
        var key = code.indexOf("box_caixa_") === 0 ? code : ("box_caixa_" + code);
        var fd = new FormData();
        fd.append("file", f);
        fd.append("project_id", state.projectId);
        fd.append("kind", key);
        fd.append("category", "tecnico");
        fd.append("asset_key", key);
        fetch(BASE + "/upload.php", { method: "POST", credentials: "same-origin", body: fd })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (!j.ok) throw new Error(j.error || "Falha");
            toast("Imagem da caixa enviada");
            fileInp.value = "";
            return openProject(state.projectId);
          })
          .catch(function (e) { toast(e.message); });
      });
    }
    var lc = document.getElementById("link-create");
    if (lc) lc.addEventListener("click", function () {
      var role = document.getElementById("link-role").value;
      var body = {
        action: "create",
        project_id: state.projectId,
        role: role,
        label: document.getElementById("link-label").value,
        factory_key: role === "factory" ? document.getElementById("link-factory").value : null
      };
      api("access.php", { method: "POST", body: body }).then(function (j) {
        var box = document.getElementById("link-once");
        box.classList.remove("hidden");
        box.innerHTML = "<p><strong>Guarde agora (mostrado uma vez):</strong></p>" +
          "<p>Ligação: <code>" + esc(location.origin + j.link.path) + "</code></p>" +
          "<p>Código: <code>" + esc(j.link.code) + "</code></p>";
        return openProject(state.projectId);
      }).catch(function (e) { toast(e.message); });
    });
    document.querySelectorAll(".link-rev").forEach(function (b) {
      b.addEventListener("click", function () {
        api("access.php", { method: "POST", body: { action: "revoke", id: b.getAttribute("data-id") } })
          .then(function () { return openProject(state.projectId); });
      });
    });
    document.querySelectorAll(".link-rot").forEach(function (b) {
      b.addEventListener("click", function () {
        api("access.php", { method: "POST", body: { action: "rotate", id: b.getAttribute("data-id") } })
          .then(function (j) {
            var box = document.getElementById("link-once");
            box.classList.remove("hidden");
            box.innerHTML = "<p><strong>Novo acesso:</strong></p>" +
              "<p>Ligação: <code>" + esc(location.origin + j.link.path) + "</code></p>" +
              "<p>Código: <code>" + esc(j.link.code) + "</code></p>";
            return openProject(state.projectId);
          });
      });
    });
    document.querySelectorAll(".compare td.pick").forEach(function (td) {
      td.addEventListener("click", function () {
        api("approve-price.php", {
          method: "POST",
          body: {
            project_id: state.projectId,
            item_key: td.getAttribute("data-item"),
            factory_key: td.getAttribute("data-factory"),
            price_eur: td.getAttribute("data-price")
          }
        }).then(function () { toast("Preço aprovado"); return openProject(state.projectId); })
          .catch(function (e) { toast(e.message); });
      });
    });
    var sp = document.getElementById("adm-save-pricing");
    if (sp) sp.addEventListener("click", savePricing);
    document.querySelectorAll(".ver-rest").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!confirm("Restaurar esta versão?")) return;
        api("restore.php", {
          method: "POST",
          body: { project_id: state.projectId, version_no: Number(b.getAttribute("data-v")) }
        }).then(function () { toast("Versão restaurada"); return openProject(state.projectId); })
          .catch(function (e) { toast(e.message); });
      });
    });
    bindPrintOpts();
  }

  function savePricing() {
    var d = state.data;
    d.pricing_placeholders = d.pricing_placeholders || {};
    function num(id) {
      var v = document.getElementById(id).value.trim();
      return v === "" ? null : Number(v.replace(",", "."));
    }
    d.pricing_placeholders.margin_percent = num("ph-margin-pct");
    d.pricing_placeholders.margin_amount_eur = num("ph-margin-amt");
    d.pricing_placeholders.installation_per_unit_eur = num("ph-install");
    d.pricing_placeholders.shipping_per_unit_eur = num("ph-ship");
    d.pricing_placeholders.selling_price_per_unit_eur = num("ph-sell");
    var facSel = document.getElementById("ph-factory");
    d.pricing_placeholders.approved_factory_key = facSel && facSel.value ? facSel.value : null;
    var units = (d.project && d.project.units) || 1;
    if (d.pricing_placeholders.selling_price_per_unit_eur != null) {
      d.pricing_placeholders.selling_price_x6_eur = d.pricing_placeholders.selling_price_per_unit_eur * units;
    }
    if (d.pricing_placeholders.installation_per_unit_eur != null) {
      d.pricing_placeholders.installation_x6_eur = d.pricing_placeholders.installation_per_unit_eur * units;
    }
    if (d.pricing_placeholders.shipping_per_unit_eur != null) {
      d.pricing_placeholders.shipping_x6_eur = d.pricing_placeholders.shipping_per_unit_eur * units;
    }
    d.editor_settings = d.editor_settings || {};
    d.editor_settings.hide_margin_from_filipe = !!(document.getElementById("hide-margin") && document.getElementById("hide-margin").checked);
    api("project.php", { method: "POST", body: { id: state.projectId, data: d, note: "preços" } })
      .then(function () { toast("Preços gravados"); return openProject(state.projectId); })
      .catch(function (e) { toast(e.message); });
  }

  function bindEditor() {
    bindADefinirSave();
    var b = document.getElementById("ed-save");
    if (b) b.addEventListener("click", function () {
      saveEditorData("edição").catch(function (e) { toast(e.message); });
    });
  }

  function bindFactory() {
    var b = document.getElementById("fq-save");
    if (!b) return;
    b.addEventListener("click", function () {
      var boxes = {};
      document.querySelectorAll(".fq-price").forEach(function (inp) {
        var code = inp.getAttribute("data-box");
        boxes[code] = boxes[code] || {};
        var v = inp.value.trim();
        boxes[code].price_eur = v === "" ? null : Number(v.replace(",", "."));
      });
      document.querySelectorAll(".fq-mat").forEach(function (inp) {
        var code = inp.getAttribute("data-box");
        boxes[code] = boxes[code] || {};
        boxes[code].material = inp.value.trim();
      });
      function num(id) {
        var v = document.getElementById(id).value.trim();
        return v === "" ? null : Number(v.replace(",", "."));
      }
      var quote = {
        factory_name: document.getElementById("fq-name").value.trim(),
        boxes: boxes,
        installation_per_unit_eur: num("fq-install"),
        shipping_per_unit_eur: num("fq-ship"),
        lead_time_days: num("fq-lead"),
        payment_terms_pt: document.getElementById("fq-pay").value.trim(),
        notes_pt: document.getElementById("fq-notes").value.trim()
      };
      api("project.php", { method: "POST", body: { id: state.projectId, quote: quote } })
        .then(function () { toast("Cotação enviada"); return openProject(state.projectId); })
        .catch(function (e) { toast(e.message); });
    });
  }

  function bindClient() {
    function currentChoice() {
      var mat = document.querySelector("input[name=mat]:checked");
      return {
        material_option_id: mat ? mat.value : null,
        set_code: document.getElementById("cl-set").value,
        with_installation: document.getElementById("cl-install").checked,
        with_equipment: document.getElementById("cl-equip").checked
      };
    }
    function refreshPrice() {
      var el = document.getElementById("cl-price");
      if (el) el.textContent = clientPriceLabel(state.data, currentChoice());
    }
    document.querySelectorAll("#client-mats input, #cl-install, #cl-equip, #cl-set").forEach(function (n) {
      n.addEventListener("change", refreshPrice);
    });
    var send = document.getElementById("cl-send");
    if (send) send.addEventListener("click", function () {
      api("client-choice.php", { method: "POST", body: currentChoice() })
        .then(function () { toast("Escolha enviada"); return openProject(state.projectId); })
        .catch(function (e) { toast(e.message); });
    });
  }

  function bindPrintOpts() {
    /* impressão inclui todas as secções */
  }

  // Polling leve para vistas partilhadas
  setInterval(function () {
    if (!state.me || !state.projectId) return;
    if (state.me.role !== "khaled" && state.me.role !== "filipe") return;
    if (document.hidden) return;
    api("project.php?id=" + encodeURIComponent(state.projectId)).then(function (j) {
      if (!state.project || j.project.updated_at !== state.project.updated_at) {
        state.project = j.project;
        state.data = j.project.data;
        render();
      }
    }).catch(function () {});
  }, 20000);

  boot();
})();
</script>
</body>
</html>
